<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — Tremplin</title>
<link rel="stylesheet" href="css/marketing.css">
<style>
.error-wrap{min-height:calc(100vh - 73px);display:flex;align-items:center;justify-content:center;padding:48px 24px;text-align:center;}
.error-code{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(72px,14vw,140px);color:var(--teal-soft);line-height:1;-webkit-text-stroke:2px var(--teal);}
.error-wrap h1{font-size:clamp(22px,3.5vw,28px);margin:12px 0 10px;}
.error-wrap p{color:var(--ink-dim);font-size:15px;max-width:420px;margin:0 auto 28px;}
.error-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a href="home.html" class="logo"><span class="logo-dot"></span>Tremplin</a>
    <div class="nav-links">
      <a href="home.html" class="btn btn-ghost">Accueil</a>
    </div>
  </div>
</header>

<div class="error-wrap">
  <div>
    <div class="error-code">404</div>
    <h1>Cette page a pris un autre chemin.</h1>
    <p>La page que tu cherches n'existe pas, ou plus. Repars du bon pied depuis l'accueil ou ton tableau de bord.</p>
    <div class="error-actions">
      <a href="home.html" class="btn btn-primary">Retour à l'accueil</a>
      <a href="dashboard.html" class="btn btn-ghost">Mon tableau de bord</a>
    </div>
  </div>
</div>

</body>
</html>
